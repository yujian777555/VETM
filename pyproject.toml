[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vetm"
version = "0.1.0"
description = "Validity-aware Experience Transfer Model: Phase 1 benchmark and validators"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]
